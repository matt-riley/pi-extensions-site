name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    permissions:
      contents: read
      packages: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:check
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/aube-ci.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0
    with:
      node-version: "26"
      # No lint script in this repo. `test` is `npm test`; `build` is the same
      # `npm run build` from the content commit pinned in content.lock that
      # the Cloudflare Pages build runs.
      run-lint: false
      run-test: true
      run-build: true

  deploy:
    permissions:
      contents: read
    needs: [check]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: matt-riley/matt-riley-ci/.github/workflows/request-app-deploy.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0
    with:
      dispatch-app-id: ${{ vars.INFRA_DISPATCH_APP_ID }}
      app: pi-extensions
    secrets:
      INFRA_DISPATCH_PRIVATE_KEY: ${{ secrets.INFRA_DISPATCH_PRIVATE_KEY }}
